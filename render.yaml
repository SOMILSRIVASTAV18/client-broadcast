# Render Blueprint Configuration (Standalone WhatsApp Backend Server)
services:
  - type: web
    name: whatsapp-broadcast-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      # Optional: Add Firebase Admin service account JSON if enabling Firebase custom-token bridge
      # - key: FIREBASE_SERVICE_ACCOUNT_JSON
      #   sync: false
      # Optional (if attaching a Render Persistent Disk mounted at /var/data):
      # - key: WA_AUTH_PATH
      #   value: /var/data/.wwebjs_auth
      # - key: WORKSPACE_DATA_PATH
      #   value: /var/data/store.json

