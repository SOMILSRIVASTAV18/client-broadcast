services:
  - type: web
    name: whatsapp-broadcast-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: leafy-brook-mwpgt
      - key: WA_AUTH_PATH
        value: ./.wwebjs_auth
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
    # Optional: Uncomment on a paid Render plan to persist WhatsApp QR sessions across deploys:
    # disk:
    #   name: wa-auth-data
    #   mountPath: /app/.wwebjs_auth
    #   sizeGB: 1
